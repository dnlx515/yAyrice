[general]
bars = 0
bar_width = 1
bar_spacing = 1
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = noncurses
orientation = bottom
channels = mono
mono_option = average

[color]
gradient = 1
gradient_count = 4
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.tertiary.default.hex}}'
gradient_color_4 = '{{colors.tertiary_container.default.hex}}'

[smoothing]
monstercat = 1
noise_reduction = 60
gravity = 100
