[config]

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/style.css'
post_hook = 'pkill -SIGUSR2 -x waybar'

[templates.hypr-colors]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.cache/matugen/colors.lua'
post_hook = 'hyprctl reload'

[templates.rofi]
input_path = '~/.config/matugen/templates/config.rasi'
output_path = '~/.config/rofi/config.rasi'

[templates.rofi-power-menu]
input_path = '~/.config/matugen/templates/power-menu.rasi'
output_path = '~/.config/rofi/power-menu.rasi'

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync-style.css'
output_path = '~/.config/swaync/style.css'
post_hook = 'swaync-client -rs'

[templates.cava]
input_path = '~/.config/matugen/templates/cava.conf'
output_path = '~/.config/cava/config'

[templates.zsh]
input_path = '~/.config/matugen/templates/zsh-colors.zsh'
output_path = '~/.cache/matugen/zsh-colors.zsh'

[templates.sddm]
input_path = '~/.config/matugen/templates/sddm-theme.conf'
output_path = '~/.cache/matugen/sddm-theme.conf'
post_hook = 'install -m 644 ~/.cache/matugen/sddm-theme.conf /usr/share/sddm/themes/simple_sddm_2/theme.conf'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.gtk4-dark]
input_path = '~/.config/matugen/templates/gtk4.css'
output_path = '~/.config/gtk-4.0/gtk-dark.css'
