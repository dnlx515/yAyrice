# Font
font_family CaskaydiaCove Nerd Font Mono
font_size 12.0

# Window
background_opacity 0.72
dynamic_background_opacity yes
window_padding_width 14
window_margin_width 0

window_border_width 1
draw_minimal_borders yes
active_border_color #F2A98C
inactive_border_color #4C4E61

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_text_color #161014

# Behavior
enable_audio_bell no
copy_on_select clipboard
scrollback_lines 10000

# Tab
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #F2A98C
active_tab_foreground #161014
inactive_tab_background #2A2028
inactive_tab_foreground #B9A49D
tab_bar_background #161014

# Base
background #161014
foreground #F2EDE4
selection_background #4C4E61
selection_foreground #F2EDE4
cursor #F2A98C
url_color #7D89A6

# Palette
color0  #221E28
color8  #4C4E61
color1  #C98A8A
color9  #DBA6A6
color2  #9CAF9A
color10 #B7C7B3
color3  #E0B37A
color11 #F0C99A
color4  #7D89A6
color12 #9AA6C4
color5  #A98AA8
color13 #C2A9C0
color6  #7FA8A8
color14 #A3C4C4
color7  #D8CFC8
color15 #F2EDE4
